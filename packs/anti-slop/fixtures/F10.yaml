id: F10
input: |
  The parser reads each line of the file and returns a list of records. Each record is a dict with the keys `id`, `name` and `size`. Malformed lines raise `ValueError` with the line number. Run `python parse.py data.txt` to print the records as JSON.
expect:
  - "changes is an empty list"
  - "revised equals the input"
  - "No false positive"
